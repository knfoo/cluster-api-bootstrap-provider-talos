---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: talosconfigtemplates.bootstrap.cluster.x-k8s.io
spec:
  group: bootstrap.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: TalosConfigTemplate
    listKind: TalosConfigTemplateList
    plural: talosconfigtemplates
    singular: talosconfigtemplate
  scope: Namespaced
  versions:
  - name: v1alpha3
    schema:
      openAPIV3Schema:
        description: TalosConfigTemplate is the Schema for the talosconfigtemplates
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TalosConfigTemplateSpec defines the desired state of TalosConfigTemplate
            properties:
              template:
                description: TalosConfigTemplateResource defines the Template structure
                properties:
                  spec:
                    description: TalosConfigSpec defines the desired state of TalosConfig
                    properties:
                      configPatches:
                        items:
                          properties:
                            op:
                              type: string
                            path:
                              type: string
                            value:
                              x-kubernetes-preserve-unknown-fields: true
                          required:
                          - op
                          - path
                          type: object
                        type: array
                      data:
                        type: string
                      dataSecretKey:
                        description: |-
                          DataSecretKey overrides the key name in the bootstrap data secret.
                          Defaults to "value". Set to "userData" for Metal3/BMH compatibility.
                        type: string
                      generateType:
                        type: string
                      hostname:
                        description: Set hostname in the machine configuration to
                          some value.
                        properties:
                          source:
                            description: |-
                              Source of the hostname.

                              Allowed values:
                              "MachineName" (use linked Machine's Name).
                              "InfrastructureName" (use linked Machine's infrastructure's name).
                            type: string
                        type: object
                      metadataFrom:
                        description: |-
                          MetadataFrom specifies where to read infrastructure metadata for template
                          processing. When set, StrategicPatches are rendered through Go's
                          text/template engine. Supports flat key:value, YAML, or JSON formats.
                        properties:
                          infrastructureMachine:
                            description: |-
                              InfrastructureMachine derives the metadata secret name from the
                              infrastructure machine reference (Machine.Spec.InfrastructureRef.Name).
                            properties:
                              dataKey:
                                description: 'DataKey is the key within the secret
                                  data. Default: "metaData".'
                                type: string
                              secretNameSuffix:
                                description: |-
                                  SecretNameSuffix is appended to the infrastructure machine name
                                  to form the metadata secret name. Default: "-metadata".
                                type: string
                            type: object
                          secretRef:
                            description: SecretRef references a specific secret containing
                              metadata.
                            properties:
                              key:
                                description: 'Key within the secret data containing
                                  the metadata. Default: "metaData".'
                                type: string
                              name:
                                description: Name of the secret in the same namespace
                                  as the TalosConfig.
                                type: string
                            required:
                            - name
                            type: object
                        type: object
                      strategicPatches:
                        description: Talos Linux machine configuration strategic merge
                          patch list.
                        items:
                          type: string
                        type: array
                      talosVersion:
                        type: string
                      templateVariables:
                        additionalProperties:
                          type: string
                        description: |-
                          TemplateVariables are inline key-value pairs merged into the template
                          context alongside metadata from MetadataFrom.
                        type: object
                    required:
                    - generateType
                    type: object
                type: object
            required:
            - template
            type: object
        type: object
    served: true
    storage: false
    subresources:
      status: {}
  - additionalPrinterColumns:
    - description: Name of the ClusterClass owning this template
      jsonPath: .metadata.ownerReferences[?(@.kind=="ClusterClass")].name
      name: ClusterClass
      type: string
    - description: Name of the Cluster owning this template
      jsonPath: .metadata.ownerReferences[?(@.kind=="Cluster")].name
      name: Cluster
      type: string
    - description: Time duration since creation of TalosConfigTemplate
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: TalosConfigTemplate is the Schema for the talosconfigtemplates
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TalosConfigTemplateSpec defines the desired state of TalosConfigTemplate
            properties:
              template:
                description: TalosConfigTemplateResource defines the Template structure
                properties:
                  spec:
                    description: TalosConfigSpec defines the desired state of TalosConfig
                    properties:
                      configPatches:
                        description: RFC6902 JSON patches to apply to machine configuration.
                        items:
                          properties:
                            op:
                              type: string
                            path:
                              type: string
                            value:
                              x-kubernetes-preserve-unknown-fields: true
                          required:
                          - op
                          - path
                          type: object
                        type: array
                      data:
                        description: Machine configuration in case generateType=none.
                        type: string
                      dataSecretKey:
                        description: |-
                          DataSecretKey overrides the key name in the bootstrap data secret.
                          Defaults to "value". Set to "userData" for Metal3/BMH compatibility.
                        type: string
                      generateType:
                        description: |-
                          Talos machine configuration type to generate: Supported values are:
                          controlplane, worker, init (deprecated), none (configuration must be then provided in data field).
                        enum:
                        - controlplane
                        - worker
                        - init
                        - none
                        type: string
                      hostname:
                        description: Set hostname in the machine configuration to
                          some value.
                        properties:
                          source:
                            description: |-
                              Source of the hostname.

                              Allowed values:
                              "MachineName" (use linked Machine's Name).
                              "InfrastructureName" (use linked Machine's infrastructure's name).
                            type: string
                        type: object
                      metadataFrom:
                        description: |-
                          MetadataFrom specifies where to read infrastructure metadata for template
                          processing. The metadata secret may contain flat key:value pairs, YAML, or
                          JSON — nested structures are flattened to dot-notation keys automatically.
                          When set, StrategicPatches are rendered through Go's text/template engine
                          with functions: get(key), has(key), default(fallback, value),
                          required(errMsg, value). Plain strings without template syntax pass through
                          unchanged.
                        properties:
                          infrastructureMachine:
                            description: |-
                              InfrastructureMachine derives the metadata secret name from the
                              infrastructure machine reference (Machine.Spec.InfrastructureRef.Name).
                            properties:
                              dataKey:
                                default: metaData
                                description: 'DataKey is the key within the secret
                                  data. Default: "metaData".'
                                type: string
                              secretNameSuffix:
                                default: -metadata
                                description: |-
                                  SecretNameSuffix is appended to the infrastructure machine name
                                  to form the metadata secret name. Default: "-metadata".
                                type: string
                            type: object
                          secretRef:
                            description: SecretRef references a specific secret containing
                              metadata.
                            properties:
                              key:
                                default: metaData
                                description: 'Key within the secret data containing
                                  the metadata. Default: "metaData".'
                                type: string
                              name:
                                description: Name of the secret in the same namespace
                                  as the TalosConfig.
                                type: string
                            required:
                            - name
                            type: object
                        type: object
                      strategicPatches:
                        description: Talos Linux machine configuration strategic merge
                          patch list.
                        items:
                          type: string
                        type: array
                      talosVersion:
                        description: |-
                          Version of Talos to generate machine configuration for, i.e. v1.0 (patch version may be omitted).
                          Defaults to the latest supported version if unspecified.
                          It is recommended to set this field explicitly to avoid unexpected issues during provider upgrades.
                        type: string
                      templateVariables:
                        additionalProperties:
                          type: string
                        description: |-
                          TemplateVariables are inline key-value pairs merged into the template
                          context alongside metadata from MetadataFrom. These are available in
                          StrategicPatches via {{get "key"}} or {{.key}}.
                          Template variables take precedence over metadata values for the same key.
                        type: object
                    required:
                    - generateType
                    type: object
                type: object
            required:
            - template
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
