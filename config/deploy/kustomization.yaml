apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The modified CRDs are applied directly so the new fields
# (metadataFrom, templatePatches, dataSecretKey) are registered
# before the operator deploys the controller.
resources:
  - cabpt-bootstrap-provider.yaml
  - ../crd/bases/bootstrap.cluster.x-k8s.io_talosconfigs.yaml
  - ../crd/bases/bootstrap.cluster.x-k8s.io_talosconfigtemplates.yaml
